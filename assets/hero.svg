<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" xml:space="preserve" role="img" aria-label="Spark HUD: an animated HUD above the Claude Code prompt">
  <title>Spark HUD</title>
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#A8553A"/>
      <stop offset="0.5" stop-color="#D97757"/>
      <stop offset="1" stop-color="#EBA285"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="960 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A8553A"/>
      <stop offset="0.55" stop-color="#D97757"/>
      <stop offset="1" stop-color="#EBA285"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E7E5E4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E7E5E4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E7E5E4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ctxFill"><rect x="146" y="150" width="88" height="12" rx="2"/></clipPath>
    <clipPath id="fiveFill"><rect x="356" y="150" width="34" height="12" rx="2"/></clipPath>
    <style>
      text { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 14px; }
      .muted { fill: #8A8580; }
      .txt { fill: #EDE6E1; }
      .dim { fill: #57534E; }
      .ok { fill: #6BAA75; font-weight: 700; }
      .warn { fill: #D9A441; font-weight: 700; }
      .chip { fill: #1F1B19; }
      .chipt { fill: #EDE6E1; font-weight: 700; font-size: 12px; }
      .rule { fill: url(#rule); }
      .bold { font-weight: 700; }
      .f { opacity: 0; animation: dance 1.2s steps(1) infinite; }
      .f1 { animation-delay: 0s; } .f2 { animation-delay: -0.9s; } .f3 { animation-delay: -0.6s; } .f4 { animation-delay: -0.3s; }
      @keyframes dance { 0% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
      .tw { animation: tw 1.6s ease-in-out infinite; }
      .tw2 { animation-delay: -0.5s; } .tw3 { animation-delay: -1s; }
      @keyframes tw { 0%,100% { opacity: 1; } 50% { opacity: 0.15; } }
      .spin { animation: tw 0.8s steps(2) infinite; }
      .caret { animation: tw 1s steps(1) infinite; }
    </style>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="959" height="329" rx="12" fill="#0E0E0E" stroke="#262626"/>
  <circle cx="22" cy="20" r="6" fill="#3A3A3A"/><circle cx="42" cy="20" r="6" fill="#3A3A3A"/><circle cx="62" cy="20" r="6" fill="#3A3A3A"/>
  <text x="480" y="25" text-anchor="middle" class="muted" style="font-size:12px">claude — ~/projects/shop-api</text>

  <!-- transcript -->
  <text x="24" y="64"><tspan class="muted">&gt; </tspan><tspan class="txt">refactor the auth module and add tests</tspan></text>
  <text x="24" y="90"><tspan fill="#D97757">●</tspan><tspan class="txt bold"> Agent</tspan><tspan class="muted">(Explore: map auth call sites)</tspan></text>
  <text x="24" y="112"><tspan fill="#6BAA75">●</tspan><tspan class="txt bold"> Bash</tspan><tspan class="muted">(npm test -- auth)</tspan></text>

  <!-- top rule -->
  <text x="24" y="138" class="rule"><tspan class="bold">──╼ SPARK HUD ╾</tspan>────────────────────────────────────────────────────────────────────╼ Claude ╾──</text>

  <!-- row 1: gauges -->
  <g transform="translate(-86,0)">
  <rect x="110" y="148" width="32" height="16" rx="3" class="chip"/><text x="116" y="160" class="chipt">CTX</text>
  <rect x="146" y="150" width="140" height="12" rx="2" fill="#2E2E2E"/>
  <rect x="146" y="150" width="88" height="12" rx="2" fill="url(#bar)"/>
  <g clip-path="url(#ctxFill)"><rect x="120" y="150" width="22" height="12" fill="url(#shine)"><animate attributeName="x" from="120" to="240" dur="1.8s" repeatCount="indefinite"/></rect></g>
  <text x="292" y="161" class="warn">63%</text>

  <rect x="328" y="148" width="24" height="16" rx="3" class="chip"/><text x="333" y="160" class="chipt">5H</text>
  <rect x="356" y="150" width="140" height="12" rx="2" fill="#2E2E2E"/>
  <rect x="356" y="150" width="34" height="12" rx="2" fill="url(#bar)"/>
  <g clip-path="url(#fiveFill)"><rect x="330" y="150" width="22" height="12" fill="url(#shine)"><animate attributeName="x" from="330" to="400" dur="1.8s" repeatCount="indefinite"/></rect></g>
  <text x="502" y="161" class="ok">24%</text><text x="546" y="161" class="muted">↻ 2h 10m</text>

  <rect x="628" y="148" width="24" height="16" rx="3" class="chip"/><text x="633" y="160" class="chipt">7D</text>
  <rect x="656" y="150" width="90" height="12" rx="2" fill="#2E2E2E"/>
  <rect x="656" y="150" width="11" height="12" rx="2" fill="url(#bar)"/>
  <text x="752" y="161" class="ok">12%</text>
  </g>

  <!-- row 2: chips -->
  <text x="24" y="186"><tspan fill="#D97757" class="bold">⬢ </tspan><tspan class="txt">opus-5-5</tspan></text>
  <text x="130" y="186"><tspan fill="#EBA285" class="bold">$ </tspan><tspan class="txt">1.84</tspan></text>
  <text x="200" y="186"><tspan fill="#EBA285" class="bold spin">⠹ </tspan><tspan class="txt">3/5 agents</tspan></text>
  <text x="330" y="186"><tspan fill="#A8553A" class="bold">◫ </tspan><tspan class="txt">2 win · 1▶</tspan></text>
  <text x="450" y="186"><tspan class="muted">→ </tspan><tspan class="txt">Edit auth/session.ts</tspan></text>
  <text x="770" y="186" class="txt">▾ more</text>

  <!-- Claude, dancing while a turn runs -->
  <g class="f f1"><text x="858" y="138" fill="#EBA285" xml:space="preserve">♪     ♫</text><rect x="875.0" y="146.0" width="55.2" height="12.0" fill="#D97757"/><rect x="875.0" y="158.0" width="9.2" height="12.0" fill="#D97757"/><rect x="888.8" y="158.0" width="27.6" height="12.0" fill="#D97757"/><rect x="921.0" y="158.0" width="9.2" height="12.0" fill="#D97757"/><rect x="865.8" y="170.0" width="73.6" height="12.0" fill="#D97757"/><rect x="875.0" y="182.0" width="55.2" height="12.0" fill="#D97757"/><rect x="879.6" y="194.0" width="4.6" height="12.0" fill="#A8553A"/><rect x="888.8" y="194.0" width="4.6" height="12.0" fill="#A8553A"/><rect x="911.8" y="194.0" width="4.6" height="12.0" fill="#A8553A"/><rect x="921.0" y="194.0" width="4.6" height="12.0" fill="#A8553A"/></g>
  <g class="f f2"><text x="858" y="138" fill="#EBA285" xml:space="preserve">  ♫    ♪</text><rect x="865.8" y="146.0" width="55.2" height="12.0" fill="#D97757"/><rect x="865.8" y="158.0" width="9.2" height="12.0" fill="#D97757"/><rect x="879.6" y="158.0" width="27.6" height="12.0" fill="#D97757"/><rect x="911.8" y="158.0" width="9.2" height="12.0" fill="#D97757"/><rect x="865.8" y="170.0" width="55.2" height="12.0" fill="#D97757"/><rect x="856.6" y="182.0" width="73.6" height="12.0" fill="#D97757"/><rect x="875.0" y="194.0" width="9.2" height="12.0" fill="#A8553A"/><rect x="898.0" y="194.0" width="4.6" height="12.0" fill="#A8553A"/><rect x="911.8" y="194.0" width="4.6" height="12.0" fill="#A8553A"/></g>
  <g class="f f3"><text x="858" y="138" fill="#EBA285" xml:space="preserve">♫    ♪</text><rect x="875.0" y="146.0" width="55.2" height="12.0" fill="#D97757"/><rect x="875.0" y="158.0" width="9.2" height="12.0" fill="#D97757"/><rect x="888.8" y="158.0" width="27.6" height="12.0" fill="#D97757"/><rect x="921.0" y="158.0" width="9.2" height="12.0" fill="#D97757"/><rect x="865.8" y="170.0" width="73.6" height="12.0" fill="#D97757"/><rect x="875.0" y="182.0" width="55.2" height="12.0" fill="#D97757"/><rect x="879.6" y="194.0" width="4.6" height="12.0" fill="#A8553A"/><rect x="888.8" y="194.0" width="4.6" height="12.0" fill="#A8553A"/><rect x="911.8" y="194.0" width="4.6" height="12.0" fill="#A8553A"/><rect x="921.0" y="194.0" width="4.6" height="12.0" fill="#A8553A"/></g>
  <g class="f f4"><text x="858" y="138" fill="#EBA285" xml:space="preserve"> ♪     ♫</text><rect x="884.2" y="146.0" width="55.2" height="12.0" fill="#D97757"/><rect x="884.2" y="158.0" width="9.2" height="12.0" fill="#D97757"/><rect x="898.0" y="158.0" width="27.6" height="12.0" fill="#D97757"/><rect x="930.2" y="158.0" width="9.2" height="12.0" fill="#D97757"/><rect x="884.2" y="170.0" width="55.2" height="12.0" fill="#D97757"/><rect x="875.0" y="182.0" width="73.6" height="12.0" fill="#D97757"/><rect x="893.4" y="194.0" width="9.2" height="12.0" fill="#A8553A"/><rect x="916.4" y="194.0" width="4.6" height="12.0" fill="#A8553A"/><rect x="930.2" y="194.0" width="4.6" height="12.0" fill="#A8553A"/></g>

  <!-- bottom rule -->
  <text x="24" y="210" class="rule"><tspan class="bold">──╼ 12 turns · 1h 4m ╾</tspan>────────────────────────────────────────────────────────────────────────</text>

  <!-- prompt -->
  <rect x="24" y="226" width="912" height="40" rx="6" fill="none" stroke="#3A3A3A"/>
  <text x="38" y="251"><tspan class="muted">&gt; </tspan><tspan class="txt caret">▌</tspan></text>
  <text x="24" y="296" class="dim" style="font-size:12px">  ⏵⏵ auto mode on · ctrl+x tab to focus the HUD · /hud to expand</text>
</svg>
